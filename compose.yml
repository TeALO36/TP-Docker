# Pookie — portail de mini-jeux.
# Démarrage :  docker compose up -d --build
name: pookie

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- Reverse proxy : seul service exposé sur l'hôte ----------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/usersfile:/etc/traefik/usersfile:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/etc/traefik/usersfile
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------- Application ----------
  app:
    build: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: db
      PGUSER: ${DB_USER:-pookie}
      PGPASSWORD: ${DB_PASSWORD:-pookie}
      PGDATABASE: ${DB_NAME:-pookie}
      REDIS_HOST: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pookie-redis}
      SESSION_SECRET: ${SESSION_SECRET:-secret-de-dev-a-changer}
      PUBLIC_URL: ${PUBLIC_URL:-http://pookie.localhost}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks: [proxy, backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.pookie.rule=Host(`pookie.localhost`)
      - traefik.http.routers.pookie.entrypoints=web
      - traefik.http.routers.pookie.middlewares=pookie-compress
      - traefik.http.services.pookie.loadbalancer.server.port=3000
      - traefik.http.middlewares.pookie-compress.compress=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ---------- Cache / sessions ----------
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-pookie-redis}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pookie-redis}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ---------- Base de données ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pookie}
      POSTGRES_USER: ${DB_USER:-pookie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pookie}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

volumes:
  db-data:
  redis-data:

networks:
  proxy:
    driver: bridge
  backend:
    driver: bridge
    internal: true
